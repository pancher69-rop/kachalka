<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Тренировочный дневник Влада Цепеша</title>
  
  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icon.svg">
  <meta name="theme-color" content="#6366f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Дневник Влада">
  <meta name="mobile-web-app-capable" content="yes">
  
  <!-- Open Graph / Соцсети -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Тренировочный дневник Влада Цепеша">
  <meta property="og:description" content="Учёт тренировок, подходов и КПШ. Работает офлайн! 💪">
  <meta property="og:image" content="/icon.svg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Тренировочный дневник Влада Цепеша">
  <meta name="twitter:description" content="Учёт тренировок, подходов и КПШ. Работает офлайн! 💪">
  <meta name="twitter:image" content="/icon.svg">
  
  <!-- SEO -->
  <meta name="description" content="Тренировочный дневник с расчётом КПШ. Работает офлайн как PWA.">
  <meta name="author" content="Влад Цепеш">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0a0e1a;
      --bg-secondary: #111827;
      --bg-card: rgba(30, 41, 59, 0.6);
      --bg-card-hover: rgba(51, 65, 85, 0.8);
      --border: rgba(148, 163, 184, 0.1);
      --border-hover: rgba(148, 163, 184, 0.2);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent: #6366f1;
      --accent-light: #818cf8;
      --accent-dark: #4f46e5;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --info: #06b6d4;
      --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --gradient-accent: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      --gradient-success: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      --gradient-warning: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);
      --shadow-glow: 0 0 20px rgba(99, 102, 241, 0.3);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-primary);
      background-image: 
        url('https://image.qwenlm.ai/generated-images/59452699-96d6-4a40-9846-5cb2f05ee55f/_result.png'),
        url('https://image.qwenlm.ai/generated-images/f40798f4-d624-4e09-a702-4529f0eda293/_result.png'),
        url('https://image.qwenlm.ai/generated-images/19c1a568-3de7-4f66-9286-3bbfa6ccd463/_result.png'),
        radial-gradient(at 20% 30%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 80% 70%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
      background-size: 400px auto, 400px auto, 400px auto, 100% 100%, 100% 100%;
      background-position: left 5% top 10%, right 5% top 30%, left 50% bottom 5%, center, center;
      background-repeat: no-repeat;
      background-attachment: scroll;
      background-blend-mode: normal, normal, normal, normal, normal;
      color: var(--text-primary);
      min-height: 100vh;
      padding: 0.75rem;
      line-height: 1.6;
      position: relative;
    }
    
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: inherit;
      opacity: 0.15;
      z-index: -1;
      pointer-events: none;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      overflow-x: hidden;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 1.5rem;
      padding: 1.5rem 1rem;
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      box-shadow: var(--shadow-lg);
      position: relative;
      overflow: hidden;
    }

    @media (max-width: 640px) {
      header {
        padding: 1rem 0.75rem;
        margin-bottom: 1rem;
        border-radius: 1rem;
      }
    }

    header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--gradient-primary);
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    @media (max-width: 640px) {
      h1 {
        font-size: 1.75rem;
        margin-bottom: 0.25rem;
      }
    }

    .week-kpsh {
      color: var(--text-secondary);
      font-size: 1rem;
      font-weight: 500;
    }

    .week-kpsh span {
      color: var(--accent-light);
      font-weight: 700;
      font-size: 1.25rem;
    }

    .hint {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-top: 0.5rem;
    }

    .hint code {
      color: var(--warning);
      background: rgba(245, 158, 11, 0.1);
      padding: 0.125rem 0.375rem;
      border-radius: 0.25rem;
      font-family: 'JetBrains Mono', monospace;
    }

    /* Controls */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
      margin-bottom: 1.5rem;
      max-width: 100%;
      overflow: hidden;
    }

    @media (max-width: 640px) {
      .controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }
      
      .controls button {
        padding: 0.625rem 0.5rem;
        font-size: 0.8125rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    }

    button {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 0.75rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s;
    }

    button:hover::before {
      left: 100%;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    button:active {
      transform: translateY(0);
    }

    .btn-stats { 
      background: var(--gradient-primary);
      color: white;
    }
    .btn-export { 
      background: var(--gradient-success);
      color: white;
    }
    .btn-import { 
      background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%);
      color: white;
    }
    .btn-reset { 
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: white;
    }
    .btn-print { 
      background: var(--bg-card);
      backdrop-filter: blur(10px);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }
    .btn-share {
      background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
      color: white;
    }

    /* Filters */
    .filters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    @media (max-width: 640px) {
      .filters {
        grid-template-columns: 1fr;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }
      
      .filters select {
        width: 100%;
        padding: 0.625rem 0.75rem;
        font-size: 0.875rem;
      }
    }

    select {
      background: var(--bg-card);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 0.75rem 1rem;
      border-radius: 0.75rem;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
      max-width: 100%;
    }

    select:hover {
      border-color: var(--accent);
      background: var(--bg-card-hover);
    }

    select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    /* Stats Panel */
    .stats-panel {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-lg);
      animation: slideDown 0.3s ease-out;
    }

    @media (max-width: 640px) {
      .stats-panel {
        padding: 0.75rem;
        margin-bottom: 1rem;
        border-radius: 1rem;
      }
      
      .stats-panel h2 {
        font-size: 1.25rem;
        margin-bottom: 0.75rem;
      }
      
      .day-bar {
        gap: 0.5rem;
        margin-bottom: 0.5rem;
      }
      
      .day-label {
        width: 2.5rem;
        font-size: 0.875rem;
      }
      
      .bar-container {
        height: 1.5rem;
      }
      
      .bar-value {
        font-size: 0.75rem;
      }
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .stats-panel h2 {
      font-size: 1.5rem;
      font-weight: 700;
      background: var(--gradient-warning);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1rem;
    }

    .day-bar {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 0.75rem;
    }

    .day-label {
      width: 3rem;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .bar-container {
      flex: 1;
      background: rgba(51, 65, 85, 0.5);
      border-radius: 9999px;
      height: 2rem;
      overflow: hidden;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    .bar-fill {
      height: 100%;
      background: var(--gradient-warning);
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 0.75rem;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
    }

    .bar-value {
      font-size: 0.875rem;
      font-weight: 700;
      color: white;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    .exercise-stats {
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }

    .exercise-stats h3 {
      color: var(--text-secondary);
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    .exercise-stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 0.5rem;
    }

    .exercise-stat {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0.75rem;
      background: rgba(51, 65, 85, 0.3);
      border-radius: 0.5rem;
      font-size: 0.875rem;
      transition: all 0.2s;
    }

    .exercise-stat:hover {
      background: rgba(51, 65, 85, 0.5);
      transform: translateX(2px);
    }

    .exercise-stat-name {
      color: var(--text-secondary);
      font-weight: 500;
    }

    .exercise-stat-value {
      color: var(--accent-light);
      font-weight: 700;
    }

    /* Tabs */
    .tabs {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      padding: 0.5rem;
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 1rem;
      box-shadow: var(--shadow-md);
      max-width: 100%;
      overflow: hidden;
    }

    @media (max-width: 640px) {
      .tabs {
        gap: 0.25rem;
        padding: 0.25rem;
        margin-bottom: 1rem;
        border-radius: 0.75rem;
      }
      
      .tab {
        padding: 0.5rem 0.25rem;
        font-size: 0.8125rem;
        min-width: 0;
      }
    }

    .tab {
      padding: 0.75rem 1.5rem;
      border-radius: 0.75rem;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .tab.active {
      background: var(--gradient-primary);
      color: white;
      box-shadow: var(--shadow-glow);
      transform: scale(1.05);
    }

    .tab:not(.active) {
      background: transparent;
      color: var(--text-secondary);
    }

    .tab:not(.active):hover {
      background: rgba(99, 102, 241, 0.1);
      color: var(--text-primary);
    }

    /* Time Block */
    .time-block {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-lg);
      transition: all 0.3s;
    }

    @media (max-width: 640px) {
      .time-block {
        padding: 0.75rem;
        margin-bottom: 1rem;
        border-radius: 1rem;
      }
    }

    .time-block:hover {
      border-color: var(--border-hover);
      box-shadow: var(--shadow-lg), 0 0 30px rgba(99, 102, 241, 0.1);
    }

    .time-block-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
      gap: 0.5rem;
    }

    @media (max-width: 640px) {
      .time-block-header {
        margin-bottom: 0.75rem;
        padding-bottom: 0.5rem;
      }
      
      .time-block-header h3 {
        font-size: 1.125rem;
      }
    }

    .time-block-header h3 {
      font-size: 1.5rem;
      font-weight: 700;
      background: var(--gradient-success);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .btn-add-block {
      padding: 0.5rem 1rem;
      background: var(--gradient-primary);
      color: white;
      border: none;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: var(--shadow-sm);
    }

    .btn-add-block:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    /* Training Block */
    .training-block {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1rem;
      margin-bottom: 0.75rem;
      transition: all 0.3s;
    }

    @media (max-width: 640px) {
      .training-block {
        padding: 0.75rem;
        margin-bottom: 0.5rem;
        border-radius: 0.75rem;
      }
    }

    .training-block:hover {
      border-color: var(--border-hover);
      background: rgba(51, 65, 85, 0.6);
    }

    .block-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }

    @media (max-width: 640px) {
      .block-header {
        gap: 0.375rem;
        margin-bottom: 0.75rem;
        padding-bottom: 0.5rem;
      }
      
      .block-header select {
        flex: 1;
        min-width: 0;
        padding: 0.5rem;
        font-size: 0.8125rem;
      }
      
      .block-kpsh {
        font-size: 0.875rem;
        padding: 0.375rem 0.625rem;
      }
    }

    .block-kpsh {
      margin-left: auto;
      color: var(--warning);
      font-weight: 700;
      font-size: 1.125rem;
      padding: 0.5rem 1rem;
      background: rgba(245, 158, 11, 0.1);
      border-radius: 0.5rem;
      border: 1px solid rgba(245, 158, 11, 0.2);
    }

    .btn-delete-block {
      padding: 0.5rem 0.75rem;
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: white;
      border: none;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-delete-block:hover {
      transform: scale(1.1);
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
    }

    /* Table */
    .table-container {
      overflow-x: auto;
      border-radius: 0.75rem;
      background: rgba(15, 23, 42, 0.5);
    }

    table {
      width: 100%;
      font-size: 0.875rem;
      border-collapse: separate;
      border-spacing: 0;
    }

    th {
      text-align: left;
      padding: 0.75rem 0.5rem;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: rgba(30, 41, 59, 0.5);
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    tr:hover td {
      background: rgba(99, 102, 241, 0.05);
    }

    input[type="text"] {
      width: 100%;
      background: rgba(51, 65, 85, 0.5);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 0.625rem 0.75rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      transition: all 0.3s;
    }

    input[type="text"]:hover {
      border-color: var(--border-hover);
      background: rgba(51, 65, 85, 0.7);
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
      background: rgba(51, 65, 85, 0.8);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    input.set-input {
      min-width: 90px;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
    }

    input.set-input.warning {
      border-color: var(--danger);
      background: rgba(239, 68, 68, 0.1);
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
    }

    input.set-input.bar-side {
      border-color: var(--info);
      background: rgba(6, 182, 212, 0.1);
    }

    .set-info {
      font-size: 0.6875rem;
      color: var(--info);
      text-align: center;
      margin-top: 0.25rem;
      font-weight: 600;
    }

    .btn-add-set {
      padding: 0.5rem 0.75rem;
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-add-set:hover {
      background: var(--accent);
      border-color: var(--accent);
      transform: scale(1.1);
    }

    .kpsh-cell {
      text-align: center;
      font-weight: 700;
    }

    .kpsh-value {
      color: var(--warning);
      font-size: 1rem;
    }

    .kpsh-value.zero {
      color: var(--text-muted);
    }

    .warning-icon {
      color: var(--danger);
      font-size: 0.875rem;
      margin-top: 0.25rem;
    }

    .btn-delete-exercise {
      padding: 0.5rem;
      background: transparent;
      color: var(--danger);
      border: none;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.3s;
      border-radius: 0.5rem;
    }

    .btn-delete-exercise:hover {
      background: rgba(239, 68, 68, 0.1);
      transform: scale(1.2);
    }

    .btn-add-exercise {
      margin-top: 1rem;
      padding: 0.75rem 1.5rem;
      background: var(--gradient-success);
      color: white;
      border: none;
      border-radius: 0.75rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: var(--shadow-sm);
    }

    .btn-add-exercise:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    footer {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-top: 3rem;
      padding-bottom: 2rem;
    }

    /* Индикатор офлайн статуса */
    .offline-indicator {
      position: fixed;
      top: 10px;
      right: 10px;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.75rem;
      font-weight: 600;
      z-index: 1000;
      transition: all 0.3s;
      opacity: 0;
      pointer-events: none;
    }

    .offline-indicator.show {
      opacity: 1;
    }

    .offline-indicator.offline {
      background: rgba(239, 68, 68, 0.9);
      color: white;
    }

    .offline-indicator.online {
      background: rgba(16, 185, 129, 0.9);
      color: white;
    }

    /* Mobile Cards */
    @media (max-width: 768px) {
      h1 {
        font-size: 1.75rem;
      }

      .table-container {
        display: none;
      }

      .mobile-cards {
        display: block;
      }

      .exercise-card {
        background: rgba(51, 65, 85, 0.5);
        border: 1px solid var(--border);
        border-radius: 1rem;
        padding: 1rem;
        margin-bottom: 1rem;
        transition: all 0.3s;
      }

      .exercise-card:hover {
        border-color: var(--border-hover);
        background: rgba(51, 65, 85, 0.7);
      }

      .exercise-card-header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 0.75rem;
      }

      .exercise-card-kpsh {
        color: var(--warning);
        font-weight: 700;
        font-size: 1rem;
        white-space: nowrap;
        padding: 0.375rem 0.75rem;
        background: rgba(245, 158, 11, 0.1);
        border-radius: 0.5rem;
      }

      .sets-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.5rem;
      }

      .set-field label {
        font-size: 0.75rem;
        color: var(--text-muted);
        font-weight: 600;
        margin-bottom: 0.25rem;
        display: block;
      }

      .exercise-card-footer {
        display: flex;
        gap: 0.75rem;
        margin-top: 0.75rem;
      }
    }

    @media (min-width: 769px) {
      .mobile-cards {
        display: none;
      }
    }

    /* Print styles */
    @media print {
      body {
        background: white;
        color: black;
        padding: 0;
      }

      .no-print {
        display: none !important;
      }

      .print-view {
        display: block !important;
      }

      .print-view * {
        color: black !important;
        background: white !important;
      }

      .print-view table {
        font-size: 8pt;
        page-break-inside: avoid;
      }

      .print-view th,
      .print-view td {
        border: 1px solid #333;
        padding: 2mm;
      }
    }

    .print-view {
      display: none;
    }

    /* Animations */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .time-block,
    .training-block {
      animation: fadeIn 0.4s ease-out;
    }
  </style>
</head>
<body>
  <div id="offlineIndicator" class="offline-indicator"></div>
  
  <div class="container">
    <header>
      <h1>💪 Влад Цепеш</h1>
      <p class="week-kpsh">КПШ за неделю: <span id="weekKpsh">0</span></p>
      <p class="hint">💡 Формат <code>N*вес/повт</code> = N блинов по X кг с каждой стороны + гриф 10 кг</p>
    </header>

    <div class="controls no-print">
      <button class="btn-stats" onclick="toggleStats()">📊 Статистика</button>
      <button class="btn-export" onclick="exportData()">📤 Экспорт</button>
      <button class="btn-import" onclick="document.getElementById('fileInput').click()">📥 Импорт</button>
      <input type="file" id="fileInput" accept=".json" style="display:none" onchange="importData(event)">
      <button class="btn-reset" onclick="resetData()">🔄 Сброс</button>
      <button class="btn-print" onclick="window.print()">🖨️ Печать</button>
      <button class="btn-share" onclick="shareApp()">📤 Поделиться</button>
    </div>

    <div class="filters no-print">
      <select id="filterExercise" onchange="applyFilters()">
        <option value="">Все упражнения</option>
      </select>
      <select id="filterType" onchange="applyFilters()">
        <option value="">Все типы</option>
        <option value="Тяжелая">Тяжелая</option>
        <option value="Средняя">Средняя</option>
        <option value="Легкая">Легкая</option>
        <option value="Восстановление">Восстановление</option>
        <option value="ОФП">ОФП</option>
      </select>
    </div>

    <div id="statsPanel" class="stats-panel no-print" style="display:none"></div>

    <div class="tabs no-print">
      <div class="tab active" data-day="ПНД" onclick="switchDay('ПНД')">ПНД</div>
      <div class="tab" data-day="ВТР" onclick="switchDay('ВТР')">ВТР</div>
      <div class="tab" data-day="СРД" onclick="switchDay('СРД')">СРД</div>
      <div class="tab" data-day="ЧТВ" onclick="switchDay('ЧТВ')">ЧТВ</div>
      <div class="tab" data-day="ПТН" onclick="switchDay('ПТН')">ПТН</div>
    </div>

    <div id="content"></div>

    <footer class="no-print">
      💾 Данные сохраняются автоматически в localStorage<br>
      📱 <small>Работает офлайн! Добавьте на главный экран для быстрого доступа</small>
    </footer>
  </div>

  <div id="printView" class="print-view"></div>

  <script>
    // Константы
    const BAR_WEIGHT = 10;
    const STORAGE_KEY = 'vlad_tsepesh_training_diary';
    const DAYS = ['ПНД', 'ВТР', 'СРД', 'ЧТВ', 'ПТН'];
    const TIMES = ['Д', 'В'];
    const TIME_LABELS = { 'Д': 'Д (12:00)', 'В': 'В (17:00)' };
    const TRAINING_TYPES = ['Тяжелая', 'Средняя', 'Легкая', 'Восстановление', 'ОФП'];
    const GOALS = ['Сила', 'Выносливость', 'Тонус', 'Восстановление', 'ОФП'];

    let state = {
      blocks: [],
      activeDay: 'ПНД',
      showStats: false,
      filterExercise: '',
      filterType: ''
    };

    let idCounter = 0;
    function genId() {
      return 'id_' + Date.now().toString(36) + '_' + (++idCounter).toString(36);
    }

    function parseSet(raw) {
      const result = {
        weight: 0, reps: 0, kpsh: 0, warning: null, raw,
        isBarSide: false, sideWeight: 0, platesCount: 0
      };

      if (!raw || raw.trim() === '') return result;

      let input = raw.trim();
      input = input.replace(/^\?+\s*/, '');

      const setPrefixMatch = input.match(/^(\d+)\*(.+)$/);
      let isBarSide = false;
      let platesCount = 1;
      if (setPrefixMatch) {
        isBarSide = true;
        platesCount = parseInt(setPrefixMatch[1], 10);
        input = setPrefixMatch[2];
      }

      input = input.replace(/\+\+/g, '');
      input = input.replace(/,/g, '.');

      const slashIndex = input.indexOf('/');
      if (slashIndex === -1) {
        result.warning = `Не распознан формат: "${raw}"`;
        return result;
      }

      const weightPart = input.substring(0, slashIndex).trim();
      const repsPart = input.substring(slashIndex + 1).trim();

      const baseWeight = parseNumberOrRange(weightPart);
      if (baseWeight === null) {
        result.warning = `Не число в весе: "${weightPart}"`;
        return result;
      }

      let realWeight;
      if (isBarSide) {
        realWeight = 2 * platesCount * baseWeight + BAR_WEIGHT;
        result.isBarSide = true;
        result.sideWeight = Math.round(baseWeight * 10) / 10;
        result.platesCount = platesCount;
      } else {
        realWeight = baseWeight;
      }
      result.weight = Math.round(realWeight * 10) / 10;

      const reps = parseNumberOrRange(repsPart);
      if (reps === null) {
        result.warning = `Не число в повторах: "${repsPart}"`;
        return result;
      }
      result.reps = reps;

      result.kpsh = Math.round(realWeight * reps * 10) / 10;
      return result;
    }

    function parseNumberOrRange(str) {
      str = str.trim();
      if (!str) return null;

      const dashMatch = str.match(/^(\d+(?:\.\d+)?)\s*[-–]\s*(\d+(?:\.\d+)?)$/);
      if (dashMatch) {
        const a = parseFloat(dashMatch[1]);
        const b = parseFloat(dashMatch[2]);
        return (a + b) / 2;
      }

      if (!/^\d+(?:\.\d+)?$/.test(str)) return null;

      const num = parseFloat(str);
      if (isNaN(num)) return null;
      return num;
    }

    function calculateKpshForSets(sets) {
      let total = 0;
      for (const s of sets) {
        const parsed = parseSet(s);
        total += parsed.kpsh;
      }
      return Math.round(total * 10) / 10;
    }

    function hasWarnings(sets) {
      const warnings = [];
      for (const s of sets) {
        const parsed = parseSet(s);
        if (parsed.warning) warnings.push(parsed.warning);
      }
      return warnings;
    }

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {
        console.error('Ошибка загрузки:', e);
      }
      return createInitialData();
    }

    function saveData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.blocks));
      } catch (e) {
        console.error('Ошибка сохранения:', e);
      }
    }

    function createInitialData() {
      return [
        {
          id: genId(), day: 'ПНД', time: 'Д', type: 'Средняя', goal: 'Восстановление',
          exercises: [
            { id: genId(), name: 'Жим лежа', sets: ['1*8,8/8-10', '2*8,8/6-8', '3*8,8/4-6', '4*8,8/2-4', '5*8,8/1-2', '6*8,8++/1-2'], note: 'Толстый гриф с блинами Вики' },
            { id: genId(), name: 'Подн. Шт. на бицепс', sets: ['30/10', '', '30/10', '', '30/10', ''], note: '' }
          ]
        },
        {
          id: genId(), day: 'ПНД', time: 'В', type: 'Средняя', goal: '',
          exercises: [
            { id: genId(), name: 'Тяга блока к поясу', sets: ['1*8,8/12', '', '1*8,8/12', '', '2*8,8/10', ''], note: '' },
            { id: genId(), name: 'Жим лежа', sets: ['50/15', '60/12', '70/10', '90/1', '110/1', '??? 120/1'], note: 'Не жестить' }
          ]
        },
        {
          id: genId(), day: 'ВТР', time: 'Д', type: 'Тяжелая', goal: 'Сила',
          exercises: [
            { id: genId(), name: 'Жим лежа', sets: ['50/8', '70/5', '90/3', '110/1', '130/1', '1ПМ/1'], note: 'Без отказа' },
            { id: genId(), name: 'Жим 45°', sets: ['1*8,8/12-15', '', '2*8,8/10-12', '', '3*8,8/6-8', ''], note: '' }
          ]
        },
        {
          id: genId(), day: 'ВТР', time: 'В', type: 'Легкая', goal: 'Выносливость',
          exercises: [
            { id: genId(), name: 'Тягу Ш. к поясу в накл.', sets: ['70/8', '', '90/6', '', '110/4', ''], note: 'Тонкий грф, нормальные блины' }
          ]
        },
        {
          id: genId(), day: 'ВТР', time: 'В', type: 'Тяжелая', goal: 'Сила',
          exercises: [
            { id: genId(), name: 'Жим лежа', sets: ['1*8,8/8-10', '2*8,8/6-8', '3*8,8/4-6', '4*8,8/2-4', '5*8,8/1-2', '6*8,8++/1-2'], note: 'Толстый гриф с блинами Вики' }
          ]
        },
        {
          id: genId(), day: 'СРД', time: 'Д', type: 'Тяжелая', goal: 'Сила',
          exercises: [
            { id: genId(), name: 'Жим 45°', sets: ['1*8,8/8-10', '2*8,8/6-8', '3*8,8/4-6', '4*8,8/2-4', '5*8,8/1-5', '??? 1ПМ/1-2'], note: 'Без отказа' },
            { id: genId(), name: 'Становая тяга', sets: ['50/3', '', '90-110/4', '', '130-150/1', ''], note: 'Тонкий грф, нормальные блины' }
          ]
        },
        {
          id: genId(), day: 'СРД', time: 'В', type: 'Средняя', goal: 'Тонус',
          exercises: [
            { id: genId(), name: 'Румынская тяга', sets: ['70/8', '', '90/6', '', '110/4', ''], note: 'Лямки/Тонкий грф, нормальные блины' },
            { id: genId(), name: 'Жим 45°', sets: ['1*8,8/12-15', '2*8,8/10-12', '3*8,8/6-8', '4*8,8/6-9', '5*8,8/6-10', '1ПМ/1-2'], note: '' }
          ]
        },
        {
          id: genId(), day: 'ЧТВ', time: 'Д', type: 'Легкая', goal: 'Тонус',
          exercises: [
            { id: genId(), name: 'Подн. Шт. на бицепс', sets: ['30/10', '', '30/10', '', '30/10', ''], note: 'Тонкий грф, нормальные блины' },
            { id: genId(), name: 'Жим лежа', sets: ['1*8,8/8-10', '2*8,8/6-8', '3*8,8/4-6', '4*8,8/2-4', '5*8,8/1-2', '6*8,8++/1-2'], note: '' }
          ]
        },
        {
          id: genId(), day: 'ЧТВ', time: 'В', type: '', goal: 'ОФП',
          exercises: [
            { id: genId(), name: 'Подтягивания', sets: ['', '', '', '', '', ''], note: '' },
            { id: genId(), name: 'Анжумания на брусках', sets: ['', '', '', '', '', ''], note: '' }
          ]
        },
        {
          id: genId(), day: 'ПТН', time: 'Д', type: 'Тяжелая', goal: 'Сила',
          exercises: [
            { id: genId(), name: 'Жим лежа', sets: ['50/8', '70/5', '90/3', '110/2', '120/1', '130/2'], note: '' }
          ]
        },
        {
          id: genId(), day: 'ПТН', time: 'Д', type: 'Легкая', goal: 'ОФП',
          exercises: []
        },
        {
          id: genId(), day: 'ПТН', time: 'В', type: 'Тяжелая', goal: 'Выносливость',
          exercises: [
            { id: genId(), name: 'Жим лежа', sets: ['50/8', '70/5', '90/3', '110-100/10', '110-100/10', '110-100/10'], note: '' }
          ]
        },
        {
          id: genId(), day: 'ПТН', time: 'В', type: 'Легкая', goal: 'ОФП',
          exercises: [
            { id: genId(), name: 'Анжумания на брусках', sets: ['', '', '', '', '', ''], note: '' }
          ]
        }
      ];
    }

    function render() {
      renderStats();
      renderContent();
      renderPrintView();
      updateWeekKpsh();
      updateExerciseFilter();
    }

    function updateWeekKpsh() {
      const weekKpsh = DAYS.reduce((sum, day) => sum + getDayKpsh(day), 0);
      document.getElementById('weekKpsh').textContent = weekKpsh.toFixed(1);
    }

    function getDayKpsh(day) {
      return state.blocks
        .filter(b => b.day === day)
        .reduce((sum, b) => sum + b.exercises.reduce((s, e) => s + calculateKpshForSets(e.sets), 0), 0);
    }

    function getExerciseTotalKpsh(exerciseName) {
      return state.blocks.reduce((sum, b) =>
        sum + b.exercises
          .filter(e => e.name === exerciseName)
          .reduce((s, e) => s + calculateKpshForSets(e.sets), 0), 0);
    }

    function getAllExercises() {
      return Array.from(new Set(
        state.blocks.flatMap(b => b.exercises.map(e => e.name))
      )).sort();
    }

    function updateExerciseFilter() {
      const select = document.getElementById('filterExercise');
      const currentValue = select.value;
      const exercises = getAllExercises();
      select.innerHTML = '<option value="">Все упражнения</option>' +
        exercises.map(ex => `<option value="${ex}">${ex}</option>`).join('');
      select.value = currentValue;
    }

    function renderStats() {
      const panel = document.getElementById('statsPanel');
      if (!state.showStats) {
        panel.style.display = 'none';
        return;
      }

      const maxDayKpsh = Math.max(...DAYS.map(d => getDayKpsh(d)), 1);
      const exercises = getAllExercises();

      panel.innerHTML = `
        <h2>📊 КПШ по дням недели</h2>
        ${DAYS.map(day => {
          const kpsh = getDayKpsh(day);
          const pct = (kpsh / maxDayKpsh) * 100;
          return `
            <div class="day-bar">
              <span class="day-label">${day}</span>
              <div class="bar-container">
                <div class="bar-fill" style="width: ${Math.max(pct, 2)}%">
                  <span class="bar-value">${kpsh.toFixed(1)}</span>
                </div>
              </div>
            </div>
          `;
        }).join('')}
        <div class="exercise-stats">
          <h3>КПШ по упражнениям (за всё время):</h3>
          <div class="exercise-stats-grid">
            ${exercises.map(ex => `
              <div class="exercise-stat">
                <span class="exercise-stat-name">${ex}</span>
                <span class="exercise-stat-value">${getExerciseTotalKpsh(ex).toFixed(1)}</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
      panel.style.display = 'block';
    }

    function renderContent() {
      const content = document.getElementById('content');
      const dayBlocks = state.blocks.filter(b => b.day === state.activeDay);
      const filteredBlocks = dayBlocks.filter(b => {
        if (state.filterType && b.type !== state.filterType) return false;
        if (state.filterExercise && !b.exercises.some(e => e.name === state.filterExercise)) return false;
        return true;
      });

      let html = '';
      TIMES.forEach(time => {
        const timeBlocks = filteredBlocks.filter(b => b.time === time);
        html += `
          <div class="time-block">
            <div class="time-block-header">
              <h3>⏰ ${TIME_LABELS[time]}</h3>
              <button class="btn-add-block" onclick="addBlock('${state.activeDay}', '${time}')">+ Добавить блок</button>
            </div>
            ${timeBlocks.length === 0 ? '<p style="color:var(--text-muted);font-size:0.875rem;font-style:italic;text-align:center;padding:2rem">Нет тренировок в это время</p>' : ''}
            ${timeBlocks.map(block => renderTrainingBlock(block)).join('')}
          </div>
        `;
      });

      content.innerHTML = html;
    }

    function renderTrainingBlock(block) {
      const blockKpsh = block.exercises.reduce((s, e) => s + calculateKpshForSets(e.sets), 0);
      const maxSets = Math.max(...block.exercises.map(e => e.sets.length), 6);

      return `
        <div class="training-block">
          <div class="block-header">
            <select onchange="updateBlock('${block.id}', 'type', this.value)">
              <option value="">Тип тренировки</option>
              ${TRAINING_TYPES.map(t => `<option value="${t}" ${block.type === t ? 'selected' : ''}>${t}</option>`).join('')}
            </select>
            <select onchange="updateBlock('${block.id}', 'goal', this.value)">
              <option value="">Что тренируем</option>
              ${GOALS.map(g => `<option value="${g}" ${block.goal === g ? 'selected' : ''}>${g}</option>`).join('')}
            </select>
            <span class="block-kpsh">💪 ${blockKpsh.toFixed(1)}</span>
            <button class="btn-delete-block" onclick="deleteBlock('${block.id}')">✕</button>
          </div>
          ${block.exercises.length > 0 ? `
            <div class="table-container">
              <table>
                <thead>
                  <tr>
                    <th style="min-width:140px">Упражнение</th>
                    ${Array.from({length: maxSets}, (_, i) => `<th style="min-width:90px">П${i + 1}</th>`).join('')}
                    <th style="min-width:60px">+подх</th>
                    <th style="min-width:180px">Примечание</th>
                    <th style="min-width:70px">КПШ</th>
                    <th style="width:40px"></th>
                  </tr>
                </thead>
                <tbody>
                  ${block.exercises.map(exercise => renderExerciseRow(exercise, block.id, maxSets)).join('')}
                </tbody>
              </table>
            </div>
            <div class="mobile-cards">
              ${block.exercises.map(exercise => renderExerciseCard(exercise, block.id)).join('')}
            </div>
          ` : ''}
          <button class="btn-add-exercise" onclick="addExercise('${block.id}')">+ Добавить упражнение</button>
        </div>
      `;
    }

    function renderExerciseRow(exercise, blockId, maxSets) {
      const kpsh = calculateKpshForSets(exercise.sets);
      const warnings = hasWarnings(exercise.sets);

      return `
        <tr>
          <td>
            <input type="text" value="${exercise.name}" list="exercise-names"
              onchange="updateExercise('${blockId}', '${exercise.id}', 'name', this.value)"
              placeholder="Упражнение">
          </td>
          ${Array.from({length: maxSets}, (_, i) => {
            const set = exercise.sets[i] || '';
            const parsed = parseSet(set);
            const hasWarning = !!parsed.warning;
            const className = hasWarning ? 'set-input warning' : (parsed.isBarSide ? 'set-input bar-side' : 'set-input');
            const info = parsed.isBarSide && !hasWarning ? `<div class="set-info">${parsed.platesCount}×${parsed.sideWeight}→${parsed.weight}кг</div>` : '';
            return `
              <td>
                <input type="text" class="${className}" value="${set}"
                  onchange="updateSet('${blockId}', '${exercise.id}', ${i}, this.value)"
                  placeholder="вес/повт" title="${parsed.warning || ''}">
                ${info}
              </td>
            `;
          }).join('')}
          <td>
            <button class="btn-add-set" onclick="addSet('${blockId}', '${exercise.id}')">+</button>
          </td>
          <td>
            <input type="text" value="${exercise.note}"
              onchange="updateExercise('${blockId}', '${exercise.id}', 'note', this.value)"
              placeholder="Примечание">
          </td>
          <td class="kpsh-cell">
            <span class="${kpsh > 0 ? 'kpsh-value' : 'kpsh-value zero'}">${kpsh.toFixed(1)}</span>
            ${warnings.length > 0 ? '<div class="warning-icon" title="' + warnings.join('\n') + '">⚠️</div>' : ''}
          </td>
          <td>
            <button class="btn-delete-exercise" onclick="deleteExercise('${blockId}', '${exercise.id}')">🗑️</button>
          </td>
        </tr>
      `;
    }

    function renderExerciseCard(exercise, blockId) {
      const kpsh = calculateKpshForSets(exercise.sets);
      const warnings = hasWarnings(exercise.sets);

      return `
        <div class="exercise-card">
          <div class="exercise-card-header">
            <input type="text" value="${exercise.name}" list="exercise-names"
              onchange="updateExercise('${blockId}', '${exercise.id}', 'name', this.value)"
              placeholder="Упражнение" style="flex:1">
            <span class="exercise-card-kpsh">💪 ${kpsh.toFixed(1)}</span>
            <button class="btn-delete-exercise" onclick="deleteExercise('${blockId}', '${exercise.id}')">🗑️</button>
          </div>
          <div class="sets-grid">
            ${exercise.sets.map((set, i) => {
              const parsed = parseSet(set);
              const hasWarning = !!parsed.warning;
              const className = hasWarning ? 'set-input warning' : (parsed.isBarSide ? 'set-input bar-side' : 'set-input');
              const info = parsed.isBarSide && !hasWarning ? `<div class="set-info">${parsed.platesCount}×${parsed.sideWeight}→${parsed.weight}кг</div>` : '';
              return `
                <div class="set-field">
                  <label>П${i + 1}</label>
                  <input type="text" class="${className}" value="${set}"
                    onchange="updateSet('${blockId}', '${exercise.id}', ${i}, this.value)"
                    placeholder="вес/повт" title="${parsed.warning || ''}">
                  ${info}
                </div>
              `;
            }).join('')}
          </div>
          <div class="exercise-card-footer">
            <button class="btn-add-set" onclick="addSet('${blockId}', '${exercise.id}')">+ подход</button>
            <input type="text" value="${exercise.note}"
              onchange="updateExercise('${blockId}', '${exercise.id}', 'note', this.value)"
              placeholder="Примечание" style="flex:1">
          </div>
          ${warnings.length > 0 ? `<div class="warning-icon" style="margin-top:0.5rem">⚠️ ${warnings[0]}</div>` : ''}
        </div>
      `;
    }

    function renderPrintView() {
      const printView = document.getElementById('printView');
      const weekKpsh = DAYS.reduce((sum, day) => sum + getDayKpsh(day), 0);

      let html = `
        <div style="text-align:center;margin-bottom:10px;border-bottom:1px solid #333;padding-bottom:5px">
          <h1 style="font-size:14pt;margin:0">Влад Цепеш — тренировочный дневник</h1>
          <p style="font-size:10pt;margin:5px 0 0 0">Общий КПШ за неделю: ${weekKpsh.toFixed(1)}</p>
        </div>
      `;

      DAYS.forEach(day => {
        const dayBlocks = state.blocks.filter(b => b.day === day);
        if (dayBlocks.length === 0) return;

        const dayKpsh = getDayKpsh(day);
        html += `<div style="margin-bottom:8px;page-break-inside:avoid">
          <h2 style="font-size:11pt;margin:0 0 3px 0;background:#e5e7eb;padding:2px 4px">${day} <span style="float:right;font-weight:bold">КПШ: ${dayKpsh.toFixed(1)}</span></h2>`;

        TIMES.forEach(time => {
          const timeBlocks = dayBlocks.filter(b => b.time === time);
          if (timeBlocks.length === 0) return;

          html += `<div style="margin-left:10px;margin-bottom:3px">
            <h3 style="font-size:9pt;margin:0 0 2px 0;color:#374151">${TIME_LABELS[time]}</h3>
            <table style="width:100%;border-collapse:collapse;font-size:8pt">
              <thead>
                <tr>
                  <th style="border:1px solid #999;padding:1px 2px;background:#f3f4f6">Тип</th>
                  <th style="border:1px solid #999;padding:1px 2px;background:#f3f4f6">Цель</th>
                  <th style="border:1px solid #999;padding:1px 2px;background:#f3f4f6">Упражнение</th>
                  <th style="border:1px solid #999;padding:1px 2px;background:#f3f4f6">Подходы</th>
                  <th style="border:1px solid #999;padding:1px 2px;background:#f3f4f6">Прим.</th>
                  <th style="border:1px solid #999;padding:1px 2px;background:#f3f4f6">КПШ</th>
                </tr>
              </thead>
              <tbody>`;

          timeBlocks.forEach(block => {
            const blockKpsh = block.exercises.reduce((s, e) => s + calculateKpshForSets(e.sets), 0);
            block.exercises.forEach(ex => {
              const kpsh = calculateKpshForSets(ex.sets);
              const setsStr = ex.sets.filter(s => s.trim()).join(', ');
              html += `
                <tr>
                  <td style="border:1px solid #999;padding:1px 2px">${block.type}</td>
                  <td style="border:1px solid #999;padding:1px 2px">${block.goal}</td>
                  <td style="border:1px solid #999;padding:1px 2px">${ex.name}</td>
                  <td style="border:1px solid #999;padding:1px 2px;font-size:7pt">${setsStr}</td>
                  <td style="border:1px solid #999;padding:1px 2px;font-size:7pt">${ex.note}</td>
                  <td style="border:1px solid #999;padding:1px 2px;text-align:center;font-weight:bold">${kpsh.toFixed(1)}</td>
                </tr>
              `;
            });
            html += `
              <tr style="background:#f9fafb">
                <td colspan="5" style="border:1px solid #999;padding:1px 2px;text-align:right;font-weight:bold">Блок КПШ:</td>
                <td style="border:1px solid #999;padding:1px 2px;text-align:center;font-weight:bold">${blockKpsh.toFixed(1)}</td>
              </tr>
            `;
          });

          html += `</tbody></table></div>`;
        });

        html += `</div>`;
      });

      printView.innerHTML = html;
    }

    function switchDay(day) {
      state.activeDay = day;
      document.querySelectorAll('.tab').forEach(tab => {
        tab.classList.toggle('active', tab.dataset.day === day);
      });
      render();
    }

    function toggleStats() {
      state.showStats = !state.showStats;
      render();
    }

    function applyFilters() {
      state.filterExercise = document.getElementById('filterExercise').value;
      state.filterType = document.getElementById('filterType').value;
      render();
    }

    function updateBlock(blockId, field, value) {
      const block = state.blocks.find(b => b.id === blockId);
      if (block) {
        block[field] = value;
        saveData();
        render();
      }
    }

    function updateExercise(blockId, exerciseId, field, value) {
      const block = state.blocks.find(b => b.id === blockId);
      if (block) {
        const exercise = block.exercises.find(e => e.id === exerciseId);
        if (exercise) {
          exercise[field] = value;
          saveData();
          render();
        }
      }
    }

    function updateSet(blockId, exerciseId, setIndex, value) {
      const block = state.blocks.find(b => b.id === blockId);
      if (block) {
        const exercise = block.exercises.find(e => e.id === exerciseId);
        if (exercise) {
          exercise.sets[setIndex] = value;
          saveData();
          render();
        }
      }
    }

    function addBlock(day, time) {
      state.blocks.push({
        id: genId(),
        day,
        time,
        type: '',
        goal: '',
        exercises: []
      });
      saveData();
      render();
    }

    function deleteBlock(blockId) {
      if (confirm('Удалить этот блок тренировки?')) {
        state.blocks = state.blocks.filter(b => b.id !== blockId);
        saveData();
        render();
      }
    }

    function addExercise(blockId) {
      const block = state.blocks.find(b => b.id === blockId);
      if (block) {
        block.exercises.push({
          id: genId(),
          name: '',
          sets: ['', '', '', '', '', ''],
          note: ''
        });
        saveData();
        render();
      }
    }

    function deleteExercise(blockId, exerciseId) {
      const block = state.blocks.find(b => b.id === blockId);
      if (block) {
        block.exercises = block.exercises.filter(e => e.id !== exerciseId);
        saveData();
        render();
      }
    }

    function addSet(blockId, exerciseId) {
      const block = state.blocks.find(b => b.id === blockId);
      if (block) {
        const exercise = block.exercises.find(e => e.id === exerciseId);
        if (exercise) {
          exercise.sets.push('');
          saveData();
          render();
        }
      }
    }

    function exportData() {
      const json = JSON.stringify(state.blocks, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'training_diary_export.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const data = JSON.parse(e.target.result);
          if (Array.isArray(data)) {
            state.blocks = data;
            saveData();
            render();
            alert('Данные успешно импортированы!');
          } else {
            alert('Неверный формат файла');
          }
        } catch {
          alert('Ошибка чтения файла');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function resetData() {
      if (confirm('Сбросить все данные к исходным? Это действие нельзя отменить.')) {
        state.blocks = createInitialData();
        saveData();
        render();
      }
    }

    state.blocks = loadData();
    render();

    const datalist = document.createElement('datalist');
    datalist.id = 'exercise-names';
    document.body.appendChild(datalist);

    // Функция "Поделиться"
    function shareApp() {
      const shareData = {
        title: 'Тренировочный дневник Влада Цепеша',
        text: '💪 Тренировочный дневник с расчётом КПШ. Работает офлайн!',
        url: window.location.href
      };

      // Проверяем поддержку Web Share API
      if (navigator.share) {
        navigator.share(shareData)
          .then(() => console.log('[Share] Успешно отправлено'))
          .catch(err => {
            if (err.name !== 'AbortError') {
              console.error('[Share] Ошибка:', err);
              fallbackShare();
            }
          });
      } else {
        fallbackShare();
      }
    }

    // Фоллбэк для браузеров без Web Share API
    function fallbackShare() {
      // Копируем ссылку в буфер обмена
      const url = window.location.href;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(url)
          .then(() => {
            alert('✅ Ссылка скопирована!\n\n' + url + '\n\nОтправьте её друзьям!');
          })
          .catch(() => {
            prompt('Скопируйте ссылку:', url);
          });
      } else {
        prompt('Скопируйте ссылку:', url);
      }
    }

    // Регистрация Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => {
            console.log('[SW] Зарегистрирован:', reg.scope);
            
            // Проверяем обновления
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              console.log('[SW] Найдено обновление...');
              
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  // Новая версия доступна
                  if (confirm('Доступна новая версия приложения! Обновить сейчас?')) {
                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                    window.location.reload();
                  }
                }
              });
            });
          })
          .catch(err => {
            console.log('[SW] Ошибка регистрации:', err);
          });
      });

      // Обработка офлайн/онлайн статусов
      const indicator = document.getElementById('offlineIndicator');
      
      function showStatus(isOnline) {
        indicator.textContent = isOnline ? '🟢 Онлайн' : '🔴 Офлайн';
        indicator.className = 'offline-indicator show ' + (isOnline ? 'online' : 'offline');
        setTimeout(() => {
          indicator.classList.remove('show');
        }, 3000);
      }

      window.addEventListener('online', () => {
        console.log('[App] Подключение восстановлено');
        showStatus(true);
      });

      window.addEventListener('offline', () => {
        console.log('[App] Работа в офлайн режиме');
        showStatus(false);
      });

      // Показываем текущий статус при загрузке
      if (!navigator.onLine) {
        showStatus(false);
      }
    }
  </script>
</body>
</html>
